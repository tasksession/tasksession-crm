; PHP configuration for large uploads (Google Drive, media, system updates)
; Used when PHP loads this file from the project root (see .htaccess / admin/.htaccess)

; File upload
upload_max_filesize = 1024M
post_max_size = 1024M
max_file_uploads = 25
file_uploads = On

; Execution / input time
max_execution_time = 1500
max_input_time = 1500

; Memory
memory_limit = 1024M

; Input
max_input_vars = 3000
max_input_nesting_level = 64

; Large uploads / long requests
default_socket_timeout = 1500

; Errors (adjust error_log path per server)
display_errors = Off
log_errors = On
