name: Extract uploaded zip
on:
  push:
    paths:
      - 'tasksession-free.zip'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o -q tasksession-free.zip -d .
          git rm -q --cached tasksession-free.zip
          rm -f tasksession-free.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add TaskSession Free Edition source code"
          git push
