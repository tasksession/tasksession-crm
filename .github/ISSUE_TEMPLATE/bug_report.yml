name: Bug report
description: Something is not working in TaskSession CRM
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TaskSession version
      placeholder: e.g. 4.10
  - type: input
    id: env
    attributes:
      label: Server environment
      placeholder: e.g. PHP 8.2, MySQL 8.0, Apache, shared hosting
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Please remove passwords, API keys and personal data first.
